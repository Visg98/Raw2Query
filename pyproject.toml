[project]
name = "raw2query"
version = "0.1.0"
description = "Messy documents -> structured, queryable data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    # The HTTP client for the LLM calls. The provider is Groq, which serves an
    # OpenAI-compatible API, so this SDK talks to it via GROQ_BASE_URL.
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "unstructured[all-docs]>=0.15",
    "sqlglot>=25.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is a package (tests/__init__.py) so `from tests.conftest import ...`
# resolves; importmode=importlib keeps that working without a sys.path hack.
addopts = "--import-mode=importlib"
markers = [
    "e2e: drives the real UI in a browser; needs the API and the frontend dev server running, and R2Q_E2E=1",
]
filterwarnings = [
    # The app's own pydantic/FastAPI deprecations are pre-existing and
    # unrelated to what the tests assert; keep the output readable.
    "ignore::DeprecationWarning",
    "ignore:Support for class-based `config`:UserWarning",
]
